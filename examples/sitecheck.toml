url = "https://example.com/"

# Per-rule severity overrides ("off", "warn", "error")
[rules]
"seo/apple-touch-icon" = "warn"
"security/csp" = "error"
"http/llms-txt" = "off"

[http]
check_www_redirect = true
check_https_redirect = true
check_soft_404 = true
check_html_size = true
check_head_validity = true
check_trailing_slash = true
check_canonical = true
check_sitemap = true
check_robots = true
require_content_signal = false
allow_noindex = []
max_sitemap_urls = 15
check_llms_txt = true

[seo]
check_favicon = true
max_sitemap_urls = 15

[security_headers]
check_security_txt = false

[structured_data]
required_types = ["Organization", "WebSite"]
check_site_name = true
check_open_graph = true
check_twitter = true

[ai]
allow_blocked = []

[a11y]
paths = ["/"]
tags = ["wcag2a", "wcag2aa", "wcag21aa", "wcag22aa"]
include_incomplete = false
include_disabled = false

