[package]
name = "sitecheck"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fast, config-driven web health checks for HTTP, structured data, PageSpeed Insights, Lighthouse, and Google Search Console."
repository = "https://github.com/TheGreatAxios/sitecheck"
documentation = "https://docs.rs/sitecheck"
readme = "README.md"
keywords = ["seo", "accessibility", "audit", "cli", "lighthouse"]
categories = ["command-line-utilities", "web-programming"]
exclude = [".github/"]

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
toml = "0.8"
url = { version = "2", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
unwrap_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
